[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schema-merger"
version = "0.1.0"
description = "Deterministic profiling for heterogeneous Excel and CSV tables."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Schema Merger contributors" }]
dependencies = [
    "pandas>=2.0",
    "polars>=0.20",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Provider SDKs; `analyze` and `cluster` need the one LLM_PROVIDER names.
# `profile` and `apply` are deterministic and need none of them.
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
# Web UI backend (Stage 6a); the core and the CLI work without these.
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.scripts]
merger = "cli.main:main"

[tool.setuptools]
packages = ["core", "cli", "web", "web.backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests call a real provider (they cost money and need a key), so they are
# excluded by default; run them with: SCHEMA_MERGER_LIVE=1 pytest -m live
addopts = "-q -p no:cacheprovider --basetemp=.pytest-tmp -m \"not live\""
markers = [
    "live: hits a configured LLM provider over the network",
]
